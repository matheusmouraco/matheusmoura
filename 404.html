<style>
@font-face{font-family:'Geist';src:url('/assets/fonts/geist-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Geist';src:url('/assets/fonts/geist-500.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Geist';src:url('/assets/fonts/geist-600.woff2') format('woff2');font-weight:600;font-display:swap}

@font-face{font-family:'Geist Mono';src:url('/assets/fonts/geistmono-500.woff2') format('woff2');font-weight:500;font-display:swap}
:root{
  --ink:#0D0D0D;--paper:#F4F2EF;--dim:rgba(244,242,239,.62);--faint:rgba(244,242,239,.4);
  --line:rgba(244,242,239,.12);--line-2:rgba(244,242,239,.22);--orange:#FF4D00;--orange-2:#FF6A2B;
  --glass:linear-gradient(157deg,rgba(244,242,239,.07),rgba(244,242,239,.02));--glass-brd:rgba(244,242,239,.13);
  --ease:cubic-bezier(.22,1,.36,1);--sans:'Geist',system-ui,-apple-system,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 22px;overflow-x:hidden;position:relative}
a{color:inherit;text-decoration:none}
img{display:block}
.atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.atmo .o1{position:absolute;width:70vw;height:70vw;max-width:620px;max-height:620px;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,77,0,.16),transparent 60%);filter:blur(20px)}
.atmo .grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;opacity:.5;mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 10%,transparent 72%)}
.atmo .speed{position:absolute;inset:0;background-image:repeating-linear-gradient(123deg,transparent 0 40px,rgba(255,77,0,.05) 40px 42px);mask-image:linear-gradient(180deg,transparent,#000 45%,transparent)}
.wrap{position:relative;z-index:1;max-width:520px;display:flex;flex-direction:column;align-items:center}
.code{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--orange);display:inline-flex;align-items:center;gap:10px}
.code::before,.code::after{content:"";width:24px;height:1px;background:var(--orange)}
.big{font-weight:700;font-size:clamp(96px,26vw,200px);line-height:.9;letter-spacing:-0.05em;margin:18px 0 4px}
.big .o{color:var(--orange)}
h1{font-weight:600;font-size:clamp(26px,5.4vw,40px);line-height:1.05;letter-spacing:-0.035em}
h1 .o{color:var(--orange)}
p{margin-top:18px;color:var(--dim);font-size:clamp(15px,2vw,17px);line-height:1.6;max-width:42ch}
.cta-row{margin-top:34px;display:flex;flex-wrap:wrap;gap:13px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:15px;padding:15px 26px;border-radius:13px;transition:transform .35s var(--ease),box-shadow .35s,border-color .3s,background .3s}
.btn .arw{transition:transform .35s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn:hover .arw{transform:translateX(3px)}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 14px 34px -12px rgba(255,77,0,.55)}
.btn-primary:hover{box-shadow:0 22px 46px -12px rgba(255,77,0,.7)}
.btn-glass{background:var(--glass);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);border:1px solid var(--glass-brd);color:var(--paper)}
.btn-glass:hover{border-color:var(--orange)}
.foot{position:relative;z-index:1;margin-top:54px;display:flex;flex-direction:column;align-items:center;gap:12px}
.foot .brand{display:inline-flex;align-items:center;gap:10px;opacity:.85}
.foot .brand img{height:18px;width:auto}
.foot .brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);border-left:1px solid var(--line-2);padding-left:10px}
.foot .tag{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--faint)}
.foot .tag .o{color:var(--orange)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>

<div class="atmo" aria-hidden="true"><div class="grid"></div><div class="speed"></div><div class="o1"></div></div>

<main class="wrap">
  <span class="code">Erro 404</span>
  <div class="big">4<span class="o">0</span>4</div>
  <h1>Você saiu da <span class="o">pista.</span></h1>

  <div class="cta-row">
    <a href="/" class="btn btn-primary">Voltar pro início <span class="arw">→</span></a>
    <a href="/manual/" class="btn btn-glass">Ver os recursos grátis</a>
  </div>
</main>

<footer class="foot">
  <a href="/" class="brand"><img src="/assets/logo.svg" alt="Matheus Moura" height="18" /><span>Método Tração®</span></a>
  <p class="tag">A maioria acelera. Quase ninguém ganha <span class="o">tração.</span></p>
</footer>

</body>
</html>
